name: Build Windows Studio

# Builds the LithoLog Studio desktop app (PyInstaller, one-folder) on Windows with Python 3.12,
# runs the app's own self-check on the fresh build, and uploads the result as an artifact.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui]" qtawesome pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --workpath build_exe --distpath dist LithoLogStudio.spec

      - name: Self-check of the fresh build
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\LithoLogStudio\LithoLogStudio.exe"
          $report = Join-Path $PWD "dist\self_check.txt"
          if (-not (Test-Path $exe)) { throw "Build produced no exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--self-check", "`"$report`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Self-check did not finish within 5 minutes" }
          if (-not (Test-Path $report)) { throw "Self-check wrote no report (exit code $($p.ExitCode))" }
          Get-Content $report
          if (-not (Select-String -Path $report -Pattern "RESULT: PASS" -Quiet)) { throw "Self-check failed" }

      - name: Upload self-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-check-report
          path: dist/self_check.txt
          if-no-files-found: ignore

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: LithoLogStudio-Windows
          path: dist/LithoLogStudio/
          retention-days: 30
