[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "litholog"
dynamic = ["version"]
description = "Borehole strip logs, cross-sections, fence diagrams, 3D lithology and aquifer models, with a desktop studio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib>=3.5", "openpyxl", "scipy", "pyshp", "pyproj", "scikit-image", "plotly", "kaleido"]
keywords = ["borehole", "lithology", "hydrogeology", "geology", "strip log", "well log"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
# Desktop studio (Qt + VTK)
gui = ["PySide6", "pyvista", "pyvistaqt"]
# Browser app
app = ["streamlit>=1.50"]
dev = ["pytest", "streamlit>=1.50"]

[project.scripts]
litholog = "litholog.cli:main"

[project.gui-scripts]
litholog-studio = "litholog.studio.app:main"

[tool.setuptools.dynamic]
version = { attr = "litholog.__version__" }

[tool.setuptools.packages.find]
include = ["litholog*"]

[tool.setuptools.package-data]
litholog = ["data/*", "data/tutorial/*", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
norecursedirs = ["_internal", "Backup", "CheckOriginal", "portable", "scratch", "decompiled_*", "*.exe_extracted", "_archive", ".venv*", "litholog_source_ribbon"]
